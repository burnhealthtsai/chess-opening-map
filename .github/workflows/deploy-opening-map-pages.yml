name: Deploy chess opening map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: opening-map
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          cache-dependency-path: opening-map/pnpm-lock.yaml
          package-json-file: opening-map/package.json
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        # The checked-in sanitized puzzle source is split into a lightweight
        # search index and on-demand detail chunks. The SQLite DB stays local.
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: opening-map/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
